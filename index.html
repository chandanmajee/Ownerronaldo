<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🎁</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    color: white;
}

/* common card */
.card {
    text-align: center;
    background: rgba(255,255,255,0.15);
    padding: 35px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,0,0,0.2);
    width: 300px;
    animation: fadeIn 2s ease;
}

h1 {
    font-size: 28px;
}

p {
    font-size: 16px;
}

/* gift */
.gift {
    font-size: 60px;
    animation: bounce 1s infinite;
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* button */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #ff4b7d;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #ffe6ec;
}

/* animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

/* hearts */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 18px;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-800px); opacity: 0;}
}

/* balloons */
.balloon {
    position: absolute;
    font-size: 24px;
    animation: float 6s linear infinite;
}

/* hide section */
.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">
    <div class="gift">🎁</div>
    <h1>Hey Cutie👀🥰</h1>
    <p>Main tumhare liye ek chhota sa surprise banaya hu💖</p>
    <button onclick="openSurprise()">Open Now 🎉</button>
</div>

<!-- PAGE 2 -->
<div class="card hidden" id="page2">
    <h1>🎉 Happy Birthday Bestie🎂🤗❤️</h1>
    <div id="text"></div>
</div>

<script>

/* button click */
function openSurprise() {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
    typing(); // start typing
}

/* typing effect */
const message = "Happy Birthday Bestie🎂✨\n\nTum bhale hi online mile ho, par sach bolu… tum mere liye kaafi special ho 💖\nTumse baat karke hamesha accha feel hota hai 😊\n\nLife me jo bhi karo, hamesha khush rehna aur smile karte rehna ✨\nAur haan… aise hi contact me rehna, warna miss karunga 😄\n\nOnce again Happy Birthday 🎉💖";

let i = 0;
function typing() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i) === "\n" ? "<br>" : message.charAt(i);
        i++;
        setTimeout(typing, 50);
    }
}

/* hearts */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);

/* balloons */
setInterval(() => {
    let b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(b);

    setTimeout(() => b.remove(), 6000);
}, 800);

</script>

</body>
</html>
